<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar — Digital Twin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Apply the saved theme before first paint, so a returning dark-mode
       visitor never sees a white flash. Mirrors initTheme() in main.ts. -->
  <script>
    try {
      var t = localStorage.getItem('avatar-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/src/tokens.css">
  <link rel="stylesheet" href="/src/components.css">
  <link rel="stylesheet" href="/src/app.css">
</head>
<body class="hud-grid">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="9.5" cy="13" r="5" fill="var(--blue-strong)"/>
        <circle cx="15.5" cy="13" r="5" stroke="var(--blue-strong)" stroke-width="1.6"/>
        <circle cx="15.5" cy="13" r="1.4" fill="var(--yellow-strong)"/>
      </svg>
    </span>
    <div>
      <div class="brand-name">Avatar</div>
      <div class="brand-sub" id="brand-sub">digital twin</div>
    </div>
  </div>
  <div class="topbar-right">
    <label class="name-field" title="Your name or initials">
      <svg class="icon icon--sm" style="color:var(--text-faint)"><use href="/icons.svg#i-visitor"/></svg>
      <input type="text" id="visitor-name" placeholder="Your name / initials" maxlength="30" autocomplete="off">
    </label>
    <label class="switch" title="Remember this conversation in your browser">
      <input type="checkbox" id="keep-chat-toggle" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">Keep chat</span>
    </label>
    <button class="btn btn--ghost btn--sm" id="reset-btn">
      <svg class="icon icon--sm"><use href="/icons.svg#i-reset"/></svg> Reset
    </button>
    <span class="divider-v"></span>
    <button class="icon-btn" id="theme-toggle" title="Toggle light / dark">
      <svg class="icon icon--sm theme-moon"><use href="/icons.svg#i-moon"/></svg>
      <svg class="icon icon--sm theme-sun" style="display:none"><use href="/icons.svg#i-sun"/></svg>
    </button>
  </div>
</header>

<main class="chat">
  <div class="convo scroll" id="convo">
    <div class="convo-inner" id="convo-inner">

      <!-- Intro card (hidden once messages exist) -->
      <div class="intro" id="intro-card">
        <div class="avatar avatar-twin" style="background-image:url('/assets/avatar-robot-round.png')"></div>
        <h1>I'm <span id="intro-owner-possessive">the</span> <em>digital twin</em>.<br>Ask me anything — and the real person might just chime in.</h1>
        <p id="intro-desc">I know their background, work, and ideas. I can also put you in touch directly.</p>
        <div class="suggest-row" id="suggest-row">
          <!-- Populated dynamically from faq_queries -->
        </div>
      </div>

    </div>
  </div>

  <!-- Composer -->
  <div class="composer-dock">
    <div class="composer-wrap">
      <div id="typing-indicator" class="typing" style="display:none">
        <span class="dots"><span></span><span></span><span></span></span> Avatar is typing
      </div>
      <div class="composer" id="composer">
        <textarea id="msg-input" rows="1" placeholder="Message the digital twin…" autofocus></textarea>
        <button class="btn-send" id="send-btn" title="Send (Enter)">
          <svg class="icon"><use href="/icons.svg#i-send"/></svg>
        </button>
      </div>
      <div class="composer-hint">
        <span class="kbd-hint"><span class="kbd">Enter</span> to send</span>
        <span class="sep"></span>
        <span class="kbd-hint"><span class="kbd">Shift</span>+<span class="kbd">Enter</span> for a new line</span>
        <span class="sep"></span>
        <span>Type <strong style="color:var(--blue-ink)">Qn</strong> for an instant FAQ answer</span>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast" style="display:none" role="alert" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
